<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>업무 자동화 툴</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
            background-color: #f1f5f9;
            color: #1e293b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 30px 20px;
        }
        .app-container {
            display: flex;
            width: 100%;
            max-width: 1100px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
            overflow: hidden;
            min-height: 640px;
        }
        .sidebar {
            width: 280px;
            background-color: #f8fafc;
            border-right: 1px solid #e2e8f0;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-shrink: 0;
        }
        .sidebar-title {
            font-size: 1.2rem;
            font-weight: 800;
            color: #0f172a;
            padding: 8px 12px 16px 12px;
            border-bottom: 2px solid #e2e8f0;
            margin-bottom: 8px;
        }
        .menu-btn {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid transparent;
            background: transparent;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 10px;
            color: #64748b;
            text-align: left;
            transition: all 0.2s;
            line-height: 1.4;
        }
        .menu-btn:hover { background: #e2e8f0; color: #1e293b; }
        .menu-btn.active {
            background: #3b82f6;
            color: white;
            font-weight: 700;
            box-shadow: 0 4px 10px rgba(59, 130, 246, 0.25);
        }
        .main-content {
            flex: 1;
            padding: 32px;
            display: flex;
            flex-direction: column;
            background: #ffffff;
        }
        .content-header { margin-bottom: 20px; }
        .content-header h2 { font-size: 1.4rem; color: #0f172a; margin-bottom: 6px; }
        .content-header p { font-size: 0.9rem; color: #64748b; }
        .input-group {
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            margin-bottom: 16px;
            overflow: hidden;
        }
        .input-header {
            background: #f8fafc;
            padding: 10px 16px;
            font-size: 0.85rem;
            font-weight: 700;
            color: #475569;
            border-bottom: 1px solid #e2e8f0;
        }
        textarea {
            width: 100%;
            height: 140px;
            border: none;
            padding: 14px 16px;
            font-size: 0.95rem;
            resize: none;
            outline: none;
            line-height: 1.6;
            font-family: inherit;
        }
        .result-box {
            padding: 14px 16px;
            font-size: 0.95rem;
            min-height: 140px;
            line-height: 1.6;
            word-break: break-all;
            white-space: pre-wrap;
            color: #0f172a;
            max-height: 250px;
            overflow-y: auto;
        }
        .button-group {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: auto;
            padding-top: 10px;
        }
        .action-btn {
            padding: 10px 22px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            font-size: 0.9rem;
            transition: 0.2s;
        }
        .btn-copy { background-color: #3b82f6; color: white; }
        .btn-copy:hover { background-color: #2563eb; }
        .btn-reset { background-color: #64748b; color: white; }
        .btn-reset:hover { background-color: #475569; }

        @media (max-width: 768px) {
            .app-container { flex-direction: column; }
            .sidebar { width: 100%; border-right: none; border-bottom: 1px solid #e2e8f0; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="sidebar">
        <div class="sidebar-title">⚡ 업무 자동화</div>
        <button class="menu-btn active" id="btn1" onclick="setMode(1)">1. 업체별 시험번호 묶기</button>
        <button class="menu-btn" id="btn2" onclick="setMode(2)">2. 엑셀용 업체명 추출</button>
        <button class="menu-btn" id="btn3" onclick="setMode(3)">3. 보고서 전성분 추출</button>
        <button class="menu-btn" id="btn4" onclick="setMode(4)">4. 숫자 추가</button>
        <button class="menu-btn" id="btn5" onclick="setMode(5)">5. 국문 제품명 추출</button>
        <button class="menu-btn" id="btn6" onclick="setMode(6)">6. 영문 제품명 추출</button>
        <button class="menu-btn" id="btn7" onclick="setMode(7)">7. 중복값 제거</button>
    </div>

    <div class="main-content">
        <div class="content-header">
            <h2 id="currentTitle">1. 업체별 시험번호 묶기</h2>
            <p id="currentDesc">엑셀에서 복사한 '시험번호 업체명' 데이터를 업체별로 묶어 정렬합니다.</p>
        </div>

        <div class="input-group">
            <div class="input-header">원본 텍스트 입력</div>
            <textarea id="inputText" placeholder="여기에 내용을 붙여넣으세요..."></textarea>
        </div>

        <div class="input-group">
            <div class="input-header">교정 결과</div>
            <div class="result-box" id="outputText">텍스트를 입력해 주세요.</div>
        </div>

        <div class="button-group">
            <button class="action-btn btn-copy" onclick="copyResult()" id="copyBtn">결과 복사</button>
            <button class="action-btn btn-reset" onclick="clearText()">입력 초기화</button>
        </div>
    </div>
</div>

<script>
    const inputText = document.getElementById('inputText');
    const outputText = document.getElementById('outputText');
    const copyBtn = document.getElementById('copyBtn');
    const currentTitle = document.getElementById('currentTitle');
    const currentDesc = document.getElementById('currentDesc');

    let currentMode = 1;

    const modeInfo = {
        1: { title: "1. 업체별 시험번호 묶기", desc: "엑셀에서 복사한 '시험번호 업체명' 데이터를 업체별로 묶어 정렬합니다." },
        2: { title: "2. 엑셀용 업체명 추출", desc: "시험번호, 법인명, 특수기호, 비고/시험명 문구를 제거하고 순수 업체명만 추출합니다." },
        3: { title: "3. 보고서 전성분 추출", desc: "엑셀 복사 따옴표(\")와 공백을 지우고 쉼표(,)로 성분을 정렬합니다." },
        4: { title: "4. 숫자 추가", desc: "각 줄의 맨 앞에 1), 2), 3)... 번호를 순서대로 붙여 리스트를 확인하기 쉽게 만듭니다." },
        5: { title: "5. 국문 제품명 추출", desc: "입력된 텍스트에서 '국문:', 따옴표, 비고를 제거하고 순수 국문 제품명만 추출합니다." },
        6: { title: "6. 영문 제품명 추출", desc: "입력된 텍스트에서 '영문:', 따옴표, 비고를 제거하고 순수 영문 제품명만 추출합니다." },
        7: { title: "7. 중복값 제거", desc: "엑셀 복사 시 딸려오는 큰따옴표(\") 및 불필요한 기호를 지우고 중복 줄을 깔끔하게 제거합니다." }
    };

    function setMode(mode) {
        currentMode = mode;
        document.querySelectorAll('.menu-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById('btn' + mode).classList.add('active');

        currentTitle.innerText = modeInfo[mode].title;
        currentDesc.innerText = modeInfo[mode].desc;

        processText();
    }

    inputText.addEventListener('input', processText);

    function parseLine(line) {
        line = line.trim();
        if (!line) return null;

        let regex = /^((?:[가-힣]{1,2}\s*)?[A-Za-z]{2,}-[A-Za-z0-9]+-\d+(?:-\d+)?)(.*)$/;
        let match = line.match(regex);

        if (match) {
            let testNum = match[1].trim();
            let rawCompany = (match[2] || '').trim();
            return { testNum: testNum, rawCompany: rawCompany };
        }

        let parts = line.split(/[\s\t_]+/);
        if (parts.length >= 2) {
            return { testNum: parts[0], rawCompany: parts.slice(1).join(' ') };
        }

        return { testNum: '', rawCompany: line };
    }

    function sanitizeCompany(raw) {
        if (!raw) return '';

        let name = raw;

        // 1. 앞머리 번호, 하이픈 등 제거
        name = name.replace(/^[\d\-\.\)]+\s*/, '');

        // 2. 비고 구분 특수기호(>, ▶, →, |) 뒷부분 전체 제거
        name = name.replace(/[\>▶→\|].*$/, '');

        // 3. Draft / 드래프트 / Dr 문구 최우선 제거
        name = name.replace(/(?:[\s_\-\/]+)?(?:draft|드래프트|dr\b).*$/i, '');

        // 4. Raw data, CRF 복합 문구 선제거
        name = name.replace(/(?:[\s_\-\/]+)?raw\s*data.*$/i, '');
        name = name.replace(/(?:[\s_\-\/]+)?crf.*$/i, '');

        // 5. 법인명 및 관련 기호 제거
        name = name.replace(/\((?:주|유|합|사|재)\)|주식회사|유한회사|주\.|㈜|㈲/g, ' ');

        // 6. 괄호 비고 전체 제거
        name = name.replace(/\([^)]*\)/g, ' ');

        // 7. 주차 및 회차/차수 선제거 (예: _4주Y, 4주, 1회, 2회, 1차 등 뒷부분 통째로 삭제)
        name = name.replace(/[\s_\-]*\d+(?:주(?:차)?|회|차).*$/i, '');

        // 8. 업체명 뒤에 붙은 '데이터'/'결과데이터' 선제거
        name = name.replace(/(?:[\s_]*결과데이터.*$|[\s_]+데이터.*$|데이터(?=[A-Za-z\s]|$).*$)/i, '');

        // 9. 언더바를 공백으로 치환
        name = name.replace(/[_]+/g, ' ');

        // 10. 비고/시험/효능 키워드 토큰 필터링
        const stopWords = [
            '안면', '리프팅', '피부', '탄력', '개선', '개선율', '보습', '주름', '미백', 
            '진정', '모공', '각질', '피지', '눈가', '팔자', '볼', '이중턱', '자극', '외', 
            '결과데이터', '결과', '보고서', '발행', '선발행', '지연', '전성분', 
            '취소', '보류', '원본이미지', '원본', '이미지', 'draft', 'dr'
        ];

        let tokens = name.trim().split(/\s+/);
        let cleanTokens = [];

        for (let token of tokens) {
            let lower = token.toLowerCase();
            let hasStopWord = stopWords.some(sw => lower.includes(sw));
            if (hasStopWord) break;
            cleanTokens.push(token);
        }

        name = cleanTokens.join(' ');

        // 11. LAB 보호 및 끝머리 꼬리 영문 제거
        name = name.replace(/LAB\b/g, '__KEEP_LAB__');
        name = name.replace(/[A-Za-z]{1,3}\s*$/g, '');
        name = name.replace(/__KEEP_LAB__/g, 'LAB');

        // 12. 잔여 특수기호 정리
        name = name.replace(/[\+\-_/\\&~*\"\'\(\)\[\]]/g, ' ');

        return name.replace(/\s{2,}/g, ' ').trim();
    }

    const excludeList = ['결과데이터', '데이터', '결과', 'rawdata', '보고서', 'crf', 'raw', 'draft', 'dr'];
    function isInvalidCompany(name) {
        if (!name) return true;
        let compact = name.replace(/\s+/g, '').toLowerCase();
        return excludeList.includes(compact);
    }

    function processText() {
        let text = inputText.value;

        if (!text.trim()) {
            outputText.innerText = '텍스트를 입력해 주세요.';
            return;
        }

        try {
            // 1번: 업체별 시험번호 묶기
            if (currentMode === 1) {
                let lines = text.split(/[\r\n]+/);
                let groups = new Map();

                lines.forEach(line => {
                    let parsed = parseLine(line);
                    if (!parsed || !parsed.testNum) return;

                    let testNum = parsed.testNum;
                    let company = sanitizeCompany(parsed.rawCompany);

                    if (company && !isInvalidCompany(company)) {
                        if (!groups.has(company)) groups.set(company, []);
                        groups.get(company).push(testNum);
                    }
                });

                let resultLines = [];
                groups.forEach((testNums, company) => {
                    resultLines.push(company);
                    testNums.forEach(num => { if (num) resultLines.push(num); });
                    resultLines.push("");
                });
                text = resultLines.join('\n').trim();
            }

            // 2번: 엑셀용 업체명 추출 (행 수 1:1 보존)
            else if (currentMode === 2) {
                let lines = text.split(/\r?\n/);
                let resultLines = lines.map(line => {
                    if (!line.trim()) return '';
                    let parsed = parseLine(line);
                    if (!parsed) return '';
                    let cleaned = sanitizeCompany(parsed.rawCompany);
                    return isInvalidCompany(cleaned) ? '' : cleaned;
                });
                text = resultLines.join('\n');
            }

            // 3번: 보고서 전성분 추출
            else if (currentMode === 3) {
                let clean = text.replace(/["“”'‘’]/g, '');
                let rawList = clean.split(/[\r\n,]+/);
                let ingredients = [];
                rawList.forEach(item => {
                    let trimmed = item.replace(/\s{2,}/g, ' ').trim();
                    if (trimmed) ingredients.push(trimmed);
                });
                text = ingredients.join(', ');
            }

            // 4번: 숫자 추가
            else if (currentMode === 4) {
                let lines = text.split(/[\r\n]+/);
                let count = 1;
                let resultLines = lines.map(line => {
                    line = line.trim();
                    if (!line) return '';
                    line = line.replace(/^\d+[\.\)]\s*/, '');
                    return (count++) + ') ' + line;
                });
                text = resultLines.filter(line => line !== '').join('\n');
            }

            // 5번: 국문 제품명 추출
            else if (currentMode === 5) {
                let normalized = text.replace(/<br\s*\/?>/gi, '\n');
                let rawLines = normalized.split(/[\r\n]+/);
                let resultLines = [];

                rawLines.forEach(line => {
                    line = line.trim();
                    if (!line) return;

                    line = line.replace(/["“”'‘’]/g, '').trim();

                    if (/국문/i.test(line)) {
                        let match = line.match(/(?:국문(?:명|제품명)?|제품명)\s*[:：]\s*([^영문]+)/i);
                        if (match && match[1]) {
                            let name = match[1].replace(/영문.*$/i, '').trim();
                            if (name) resultLines.push(name);
                        } else {
                            let clean = line.replace(/^(?:국문(?:명|제품명)?|제품명)\s*[:：]\s*/i, '').trim();
                            if (clean) resultLines.push(clean);
                        }
                    } else if (!/영문|eng/i.test(line) && /[가-힣]/.test(line)) {
                        resultLines.push(line);
                    }
                });

                text = resultLines.join('\n');
            }

            // 6번: 영문 제품명 추출
            else if (currentMode === 6) {
                let normalized = text.replace(/<br\s*\/?>/gi, '\n');
                let rawLines = normalized.split(/[\r\n]+/);
                let resultLines = [];

                rawLines.forEach(line => {
                    line = line.trim();
                    if (!line) return;

                    line = line.replace(/["“”'‘’]/g, '').trim();

                    if (/영문|eng/i.test(line)) {
                        let match = line.match(/(?:영문(?:명|제품명)?|eng(?:lish)?)\s*[:：]\s*(.*)$/i);
                        if (match && match[1]) {
                            let name = match[1].trim();
                            if (name) resultLines.push(name);
                        } else {
                            let clean = line.replace(/^(?:영문(?:명|제품명)?|eng(?:lish)?)\s*[:：]\s*/i, '').trim();
                            if (clean) resultLines.push(clean);
                        }
                    } else if (!/국문/i.test(line) && !/[가-힣]/.test(line) && /[a-zA-Z]/.test(line)) {
                        resultLines.push(line);
                    }
                });

                text = resultLines.join('\n');
            }

            // 7번: 중복값 제거
            else if (currentMode === 7) {
                let lines = text.split(/[\r\n]+/);
                let seen = new Set();
                let resultLines = [];

                lines.forEach(line => {
                    let cleanLine = line.replace(/["“”'‘’]/g, '').trim();
                    if (cleanLine && !seen.has(cleanLine)) {
                        seen.add(cleanLine);
                        resultLines.push(cleanLine);
                    }
                });
                text = resultLines.join('\n');
            }

            outputText.innerText = text || '결과가 없습니다.';
        } catch (err) {
            outputText.innerText = '처리 중 오류가 발생했습니다.';
            console.error(err);
        }
    }

    function copyResult() {
        const text = outputText.innerText;
        if (!text || text === '텍스트를 입력해 주세요.' || text === '결과가 없습니다.' || text === '처리 중 오류가 발생했습니다.') return;

        navigator.clipboard.writeText(text).then(() => {
            const originalText = copyBtn.innerText;
            copyBtn.innerText = '복사 완료!';
            copyBtn.style.backgroundColor = '#10b981';
            setTimeout(() => {
                copyBtn.innerText = originalText;
                copyBtn.style.backgroundColor = '#3b82f6';
            }, 1500);
        });
    }

    function clearText() {
        inputText.value = '';
        processText();
    }
</script>
</body>
</html>
