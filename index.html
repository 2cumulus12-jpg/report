<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>업무 자동화 툴</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
            background-color: #f1f5f9;
            color: #1e293b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 30px 20px;
        }
        /* 메인 레이아웃: 좌측 사이드바 + 우측 작업창 */
        .app-container {
            display: flex;
            width: 100%;
            max-width: 1100px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
            overflow: hidden;
            min-height: 620px;
        }
        
        /* 좌측 사이드바 */
        .sidebar {
            width: 280px;
            background-color: #f8fafc;
            border-right: 1px solid #e2e8f0;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-shrink: 0;
        }
        .sidebar-title {
            font-size: 1.2rem;
            font-weight: 800;
            color: #0f172a;
            padding: 8px 12px 16px 12px;
            border-bottom: 2px solid #e2e8f0;
            margin-bottom: 8px;
        }
        .menu-btn {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid transparent;
            background: transparent;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 10px;
            color: #64748b;
            text-align: left;
            transition: all 0.2s;
            line-height: 1.4;
        }
        .menu-btn:hover {
            background: #e2e8f0;
            color: #1e293b;
        }
        .menu-btn.active {
            background: #3b82f6;
            color: white;
            font-weight: 700;
            box-shadow: 0 4px 10px rgba(59, 130, 246, 0.25);
        }

        /* 우측 메인 컨텐츠 영역 */
        .main-content {
            flex: 1;
            padding: 32px;
            display: flex;
            flex-direction: column;
            background: #ffffff;
        }
        .content-header {
            margin-bottom: 20px;
        }
        .content-header h2 {
            font-size: 1.4rem;
            color: #0f172a;
            margin-bottom: 6px;
        }
        .content-header p {
            font-size: 0.9rem;
            color: #64748b;
        }

        .input-group {
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            margin-bottom: 16px;
            overflow: hidden;
        }
        .input-header {
            background: #f8fafc;
            padding: 10px 16px;
            font-size: 0.85rem;
            font-weight: 700;
            color: #475569;
            border-bottom: 1px solid #e2e8f0;
        }
        textarea {
            width: 100%;
            height: 140px;
            border: none;
            padding: 14px 16px;
            font-size: 0.95rem;
            resize: none;
            outline: none;
            line-height: 1.6;
            font-family: inherit;
        }
        .result-box {
            padding: 14px 16px;
            font-size: 0.95rem;
            min-height: 140px;
            line-height: 1.6;
            word-break: break-all;
            white-space: pre-wrap;
            color: #0f172a;
            max-height: 250px;
            overflow-y: auto;
        }

        .button-group {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: auto;
            padding-top: 10px;
        }
        .action-btn {
            padding: 10px 22px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            font-size: 0.9rem;
            transition: 0.2s;
        }
        .btn-copy { background-color: #3b82f6; color: white; }
        .btn-copy:hover { background-color: #2563eb; }
        .btn-reset { background-color: #64748b; color: white; }
        .btn-reset:hover { background-color: #475569; }

        @media (max-width: 768px) {
            .app-container { flex-direction: column; }
            .sidebar { width: 100%; border-right: none; border-bottom: 1px solid #e2e8f0; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- 좌측 사이드바 -->
    <div class="sidebar">
        <div class="sidebar-title">⚡ 업무 자동화</div>
        <button class="menu-btn active" id="btn1" onclick="setMode(1)">1. 업체별 시험번호 묶기</button>
        <button class="menu-btn" id="btn2" onclick="setMode(2)">2. 엑셀용 업체명 추출</button>
        <button class="menu-btn" id="btn3" onclick="setMode(3)">3. 보고서 전성분 추출</button>
        <button class="menu-btn" id="btn4" onclick="setMode(4)">4. 숫자 추가 (자동목록 방지)</button>
        <button class="menu-btn" id="btn5" onclick="setMode(5)">5. 국문 제품명 추출</button>
        <button class="menu-btn" id="btn6" onclick="setMode(6)">6. 영문 제품명 추출</button>
    </div>

    <!-- 우측 메인 영역 -->
    <div class="main-content">
        <div class="content-header">
            <h2 id="currentTitle">1. 업체별 시험번호 묶기</h2>
            <p id="currentDesc">엑셀에서 복사한 '시험번호 업체명' 데이터를 업체별로 묶어 정렬합니다.</p>
        </div>

        <div class="input-group">
            <div class="input-header">원본 텍스트 입력</div>
            <textarea id="inputText" placeholder="여기에 내용을 붙여넣으세요..."></textarea>
        </div>

        <div class="input-group">
            <div class="input-header">교정 결과</div>
            <div class="result-box" id="outputText">텍스트를 입력해 주세요.</div>
        </div>

        <div class="button-group">
            <button class="action-btn btn-copy" onclick="copyResult()" id="copyBtn">결과 복사</button>
            <button class="action-btn btn-reset" onclick="clearText()">입력 초기화</button>
        </div>
    </div>
</div>

<script>
    const inputText = document.getElementById('inputText');
    const outputText = document.getElementById('outputText');
    const copyBtn = document.getElementById('copyBtn');
    const currentTitle = document.getElementById('currentTitle');
    const currentDesc = document.getElementById('currentDesc');

    let currentMode = 1;

    const modeInfo = {
        1: { title: "1. 업체별 시험번호 묶기", desc: "엑셀에서 복사한 '시험번호 업체명' 데이터를 업체별로 묶어 정렬합니다." },
        2: { title: "2. 엑셀용 업체명 추출", desc: "시험번호나 법인명(주식회사 등)을 지우고 깔끔한 업체명만 한 줄씩 추출합니다." },
        3: { title: "3. 보고서 전성분 추출", desc: "엔터나 공백으로 나뉜 단어들 사이에 쉼표(,)를 자동으로 넣어줍니다." },
        4: { title: "4. 숫자 추가 (자동목록 방지)", desc: "1), 1. 뒤에 보이지 않는 공백(Zero-width space)을 넣어 자동 번호 목록 변환을 방지합니다." },
        5: { title: "5. 국문 제품명 추출", desc: "의뢰서 텍스트에서 '국문:' 등에 적힌 한글 제품명만 한 줄씩 추출합니다." },
        6: { title: "6. 영문 제품명 추출", desc: "의뢰서 텍스트에서 '영문:' 등에 적힌 영어 제품명만 한 줄씩 추출합니다." }
    };

    function setMode(mode) {
        currentMode = mode;
        document.querySelectorAll('.menu-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById('btn' + mode).classList.add('active');

        currentTitle.innerText = modeInfo[mode].title;
        currentDesc.innerText = modeInfo[mode].desc;

        processText();
    }

    inputText.addEventListener('input', processText);

    function processText() {
        let text = inputText.value;

        if (!text.trim()) {
            outputText.innerText = '텍스트를 입력해 주세요.';
            return;
        }

        // 1번: 업체별 시험번호 묶기
        if (currentMode === 1) {
            let lines = text.split(/[\r\n]+/);
            let groups = new Map();

            lines.forEach(line => {
                line = line.trim();
                if (!line) return;

                let parts = line.split(/[\s\t]+/);
                if (parts.length >= 2) {
                    let rawTestNum = parts[0];
                    let rawCompany = parts.slice(1).join(' ');

                    let testNum = rawTestNum.replace(/[a-zA-Z가-힣]+$/, '');
                    let company = rawCompany.replace(/\(주\)|주식회사|주\.|㈜/g, '').replace(/\s{2,}/g, ' ').trim();

                    if (!groups.has(company)) groups.set(company, []);
                    groups.get(company).push(testNum);
                }
            });

            let resultLines = [];
            groups.forEach((testNums, company) => {
                resultLines.push(company);
                testNums.forEach(num => { if (num !== '') resultLines.push(num); });
                resultLines.push("");
            });
            text = resultLines.join('\n').trim();
        }

        // 2번: 엑셀용 업체명 추출
        else if (currentMode === 2) {
            let lines = text.split(/[\r\n]+/);
            let resultLines = lines.map(line => {
                line = line.trim();
                if (!line) return '';
                let parts = line.split(/[\s\t]+/);
                let rawCompany = line;
                if (parts.length >= 2) rawCompany = parts.slice(1).join(' ');

                let cleanCompany = rawCompany.replace(/\(주\)|주식회사|주\.|㈜/g, '').replace(/[a-zA-Z]+/g, '');
                return cleanCompany.replace(/\s{2,}/g, ' ').trim();
            });
            text = resultLines.filter(line => line !== '').join('\n');
        }

        // 3번: 보고서 전성분 추출
        else if (currentMode === 3) {
            text = text.replace(/[\r\n,]+/g, ' ').replace(/\s{2,}/g, ' ').trim();
            text = text.split(' ').join(', ');
        }

        // 4번: 숫자 추가 (Zero-width space 삽입)
        else if (currentMode === 4) {
            // 1), 1., (1) 등의 패턴 바로 뒤에 보이지 않는 공백(\u200B) 삽입
            text = text.replace(/(\d+[\.\)]|\(\d+\))\s*/g, '$1\u200B ');
        }

        // 5번: 국문 제품명 추출
        else if (currentMode === 5) {
            let lines = text.split(/[\r\n]+/);
            let resultLines = [];
            lines.forEach(line => {
                // '국문:', '국문명:', '제품명:', '국문' 등으로 시작하는 줄 파싱
                let match = line.match(/(?:국문(?:명|제품명)?|제품명)\s*[:：]\s*(.+)/i);
                if (match) {
                    resultLines.push(match[1].trim());
                }
            });
            // 만약 태그가 없는 일반 줄일 경우를 대비해 태그 매칭이 없으면 원본 필터링
            text = resultLines.length > 0 ? resultLines.join('\n') : text;
        }

        // 6번: 영문 제품명 추출
        else if (currentMode === 6) {
            let lines = text.split(/[\r\n]+/);
            let resultLines = [];
            lines.forEach(line => {
                // '영문:', '영문명:', 'Eng:', 'English:' 등으로 시작하는 줄 파싱
                let match = line.match(/(?:영문(?:명|제품명)?|eng(?:lish)?)\s*[:：]\s*(.+)/i);
                if (match) {
                    resultLines.push(match[1].trim());
                }
            });
            text = resultLines.length > 0 ? resultLines.join('\n') : text;
        }

        outputText.innerText = text;
    }

    function copyResult() {
        const text = outputText.innerText;
        if (text === '텍스트를 입력해 주세요.') return;

        navigator.clipboard.writeText(text).then(() => {
            const originalText = copyBtn.innerText;
            copyBtn.innerText = '복사 완료!';
            copyBtn.style.backgroundColor = '#10b981';
            setTimeout(() => {
                copyBtn.innerText = originalText;
                copyBtn.style.backgroundColor = '#3b82f6';
            }, 1500);
        });
    }

    function clearText() {
        inputText.value = '';
        processText();
    }
</script>
</body>
</html>
